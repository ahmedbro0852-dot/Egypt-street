name: Egypt Streets gameplay checks
on:
  push:
    branches: [main, feature/v100-racing-league]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Check browser JavaScript syntax
        run: |
          node --experimental-default-type=module --check public/game.js
          node --experimental-default-type=module --check public/vehicle-entry-v151.js
          node --experimental-default-type=module --check public/game-save-v55.js
      - name: Run offline gameplay regressions
        run: node --experimental-default-type=module --test tests/*.test.mjs
